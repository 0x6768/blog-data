name: 友链评论自动回复
on:
  issue_comment:
    types: [created]

jobs:
  auto-reply:
    if: contains(github.event.issue.labels.*.name, 'friends')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 处理管理员指令
        uses: actions/github-script@v7
        with:
          script: |
            // 只处理真人用户的评论，忽略 bot 自己的
            if (context.payload.comment.user.type === 'Bot') {
              console.log('Bot 评论，跳过');
              return;
            }
            
            const commentBody = context.payload.comment.body;
            const issueNumber = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            const repoOwner = context.repo.owner;
            
            console.log(`💬 收到评论 from @${commenter}: "${commentBody}"`);
            console.log(`🏠 仓库 Owner: ${repoOwner}`);
            
            // 只有仓库 Owner 才能执行操作
            if (commenter !== repoOwner) {
              console.log('👤 非管理员评论，忽略');
              return;
            }
            
            // 处理 "批准" 命令
            if (commentBody.trim() === '批准') {
              console.log('🔑 管理员批准，开始处理友链...');
              
              // 获取 Issue body 解析友链信息
              const issueBody = context.payload.issue.body;
              
              function parseFriendIssue(body) {
                const data = {};
                
                const siteNameMatch = body.match(/### 站点名称\n\n([^\n]+)/);
                data.site_name = siteNameMatch ? siteNameMatch[1].trim() : '';
                
                const siteUrlMatch = body.match(/### 网站 URL\n\n([^\n]+)/);
                data.site_url = siteUrlMatch ? siteUrlMatch[1].trim() : '';
                
                const avatarMatch = body.match(/### 头像链接（可选）\n\n([^\n]+)/);
                data.avatar = avatarMatch && avatarMatch[1].trim() !== '_No response_' ? avatarMatch[1].trim() : '';
                
                const descMatch = body.match(/### 站点简介（可选）\n\n([^\n]+)/);
                data.description = descMatch && descMatch[1].trim() !== '_No response_' ? descMatch[1].trim() : '';
                
                const backlinkMatch = body.match(/### 友链页 URL\n\n([^\n]+)/);
                data.backlink = backlinkMatch ? backlinkMatch[1].trim() : '';
                
                return data;
              }
              
              const friendData = parseFriendIssue(issueBody);
              console.log(`📋 解析到友链: ${friendData.site_name} (${friendData.site_url})`);
              
              // 读取并更新 friends.json
              const fs = require('fs');
              const path = require('path');
              
              const { data: fileData } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'friends.json'
              });
              
              const content = Buffer.from(fileData.content, 'base64').toString('utf-8');
              let friends = JSON.parse(content);
              
              console.log(`📖 当前友链数: ${friends.length}`);
              
              const newEntry = {
                name: friendData.site_name,
                avatar: friendData.avatar,
                description: friendData.description,
                url: friendData.site_url,
                backlink: friendData.backlink
              };
              
              friends.push(newEntry);
              console.log(`➕ 已添加: ${newEntry.name}`);
              
              // 提交更新
              const newContent = JSON.stringify(friends, null, 2);
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'friends.json',
                message: `管理员手动添加友链: ${friendData.site_name}`,
                content: Buffer.from(newContent).toString('base64'),
                sha: fileData.sha
              });
              
              console.log('✅ friends.json 已更新');
              
              // 打标和关闭
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['pass']
              });
              
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'manual'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '✅ 管理员已批准，友链已添加并关闭此 Issue。'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              
              console.log('🔒 Issue 已关闭');
              return;
            }
            
            // 处理 "拒绝" 命令
            if (commentBody.trim() === '拒绝') {
              console.log('❌ 管理员拒绝，开始处理...');
              
              // 打上拒绝标签
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['rejected']
              });
              
              // 移除 manual 标签
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'manual'
                });
              } catch (error) {
                console.log('⚠️ manual 标签不存在，跳过移除');
              }
              
              // 回复并关闭
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '❌ 管理员已拒绝此友链申请，Issue 已关闭。'
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              
              console.log('🔒 Issue 已关闭并标记为 rejected');
              return;
            }
            
            // 处理 "屏蔽" 命令
            if (commentBody.trim() === '屏蔽') {
              console.log('🛡️ 管理员执行屏蔽操作...');
              
              // 获取 Issue 提交者的用户 ID
              const targetUserId = context.payload.issue.user.id;
              const targetUserName = context.payload.issue.user.login;
              
              console.log(`🎯 目标用户: @${targetUserName} (ID: ${targetUserId})`);
              
              // 读取或创建 black.list
              const fs = require('fs');
              const path = require('path');
              
              const blacklistPath = path.join(process.env.GITHUB_WORKSPACE, 'black.list');
              let blackListContent = '';
              let needCreate = false;
              
              if (fs.existsSync(blacklistPath)) {
                blackListContent = fs.readFileSync(blacklistPath, 'utf-8');
                console.log('📖 已读取现有 black.list');
              } else {
                console.log('📄 black.list 不存在，将新建');
                needCreate = true;
              }
              
              // 检查是否已在黑名单中
              const lines = blackListContent ? blackListContent.split('\n').map(l => l.trim()) : [];
              if (lines.includes(String(targetUserId))) {
                console.log('⚠️ 该用户已在黑名单中');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `⚠️ 用户 @${targetUserName} (ID: \`${targetUserId}\`) 已在黑名单中，无需重复添加。`
                });
                return;
              }
              
              // 追加用户 ID
              const newLine = `${blackListContent.endsWith('\n') || blackListContent === '' ? '' : '\n'}${targetUserId}`;
              const updatedContent = blackListContent + newLine;
              
              // 写入文件
              fs.writeFileSync(blacklistPath, updatedContent, 'utf-8');
              console.log('✅ black.list 已更新');
              
              // 提交并推送 black.list
              const { execSync } = require('child_process');
              execSync('git config user.name "github-actions[bot]"', { cwd: process.env.GITHUB_WORKSPACE });
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', { cwd: process.env.GITHUB_WORKSPACE });
              execSync('git add black.list', { cwd: process.env.GITHUB_WORKSPACE });
              execSync(`git commit -m "屏蔽用户 @${targetUserName} (ID: ${targetUserId})"`, { cwd: process.env.GITHUB_WORKSPACE });
              execSync('git push', { cwd: process.env.GITHUB_WORKSPACE });
              console.log('✅ black.list 已推送到远程');
              
              // 打 rejected 标签
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['rejected']
              });
              
              // 移除 manual 标签
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: 'manual'
                });
              } catch (error) {
                console.log('⚠️ manual 标签不存在，跳过移除');
              }
              
              // 回复并关闭
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🛡️ 已屏蔽用户 @${targetUserName} (ID: \`${targetUserId}\`)，该用户今后提交的友链申请将被自动拒绝。\n\n❌ Issue 已关闭。`
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed'
              });
              
              console.log('🔒 Issue 已关闭并标记为 rejected');
              return;
            }
            
            console.log('ℹ️ 非有效指令，忽略');
