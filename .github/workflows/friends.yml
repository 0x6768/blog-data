name: 友链自动处理
on:
  issues:
    types: [opened]

concurrency:
  group: friend-link-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  MY_SITE_DOMAIN: "blog.7003410.xyz"
  MY_SITE_NAME: "晓正杨博客"
  MY_SITE_URL: "https://blog.7003410.xyz"

jobs:
  process-friend-link:
    if: |
      contains(github.event.issue.labels.*.name, 'review') &&
      contains(github.event.issue.labels.*.name, 'friends')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: 🚀 开始处理友链
        run: |
          echo "=========================================="
          echo "🎯 开始处理 Issue #${{ github.event.issue.number }}"
          echo "📝 Issue 标题: ${{ github.event.issue.title }}"
          echo "🏷️  当前标签: ${{ join(github.event.issue.labels.*.name, ', ') }}"
          echo "👤 提交者: ${{ github.event.issue.user.login }}"
          echo "🆔 提交者 ID: ${{ github.event.issue.user.id }}"
          echo "=========================================="

      # ============================================================
      # 🛡️ 黑名单检测（最高优先级，放在最前面）
      # ============================================================
      - name: 检出仓库
        if: always()
        uses: actions/checkout@v4

      - name: 🛡️ 黑名单检测
        id: check-blacklist
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const submitterId = context.payload.issue.user.id;
            const submitterLogin = context.payload.issue.user.login;
            const blacklistPath = path.join(process.env.GITHUB_WORKSPACE, 'black.list');

            console.log("==========================================");
            console.log("🛡️ 黑名单检测");
            console.log(`🆔 提交者 ID: ${submitterId}`);
            console.log(`👤 提交者 Login: ${submitterLogin}`);
            console.log(`📂 黑名单文件路径: ${blacklistPath}`);

            // 文件不存在 → 跳过检测
            if (!fs.existsSync(blacklistPath)) {
              console.log("📄 black.list 文件不存在，跳过黑名单检测");
              console.log("==========================================");
              core.setOutput('blacklisted', 'false');
              return;
            }

            // 读取黑名单
            const content = fs.readFileSync(blacklistPath, 'utf-8');
            const blacklist = content
              .split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0 && !line.startsWith('#'));

            console.log(`📋 黑名单中共 ${blacklist.length} 条记录:`);
            blacklist.forEach(id => console.log(`   - ${id}`));

            // 检查是否命中
            const isBlacklisted = blacklist.includes(String(submitterId));

            console.log(`\n🔎 检测结果: ${isBlacklisted ? '❌ 命中黑名单' : '✅ 未命中'}`);
            console.log("==========================================");

            core.setOutput('blacklisted', isBlacklisted.toString());

      - name: ❌ 黑名单命中 - 自动拒绝
        if: steps.check-blacklist.outputs.blacklisted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const submitterId = context.payload.issue.user.id;
            const submitterLogin = context.payload.issue.user.login;

            console.log(`🛡️ 黑名单命中，拒绝 Issue #${issueNumber}`);
            console.log(`   提交者: ${submitterLogin} (ID: ${submitterId})`);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['rejected']
            });

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'review'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🛡️ **自动拒绝**：用户 \`${submitterLogin}\` (ID: \`${submitterId}\`) 在黑名单中，无法申请友链。`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });

            console.log("🔒 Issue 已关闭并打上 rejected 标签");

      # ============================================================
      # 以下为正常流程（黑名单未命中才执行）
      # ============================================================
      - name: 解析友链表单
        id: parse
        if: steps.check-blacklist.outputs.blacklisted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            
            console.log("📄 Issue Body 原始内容:");
            console.log("----------------------------------------");
            console.log(body);
            console.log("----------------------------------------");
            
            function parseFriendIssue(body) {
              const data = {};
              
              const siteNameMatch = body.match(/### 站点名称\n\n([^\n]+)/);
              data.site_name = siteNameMatch ? siteNameMatch[1].trim() : '';
              console.log(`🔍 解析站点名称: "${data.site_name}"`);
              
              const siteUrlMatch = body.match(/### 网站 URL\n\n([^\n]+)/);
              data.site_url = siteUrlMatch ? siteUrlMatch[1].trim() : '';
              console.log(`🔍 解析网站 URL: "${data.site_url}"`);
              
              const avatarMatch = body.match(/### 头像链接（可选）\n\n([^\n]+)/);
              data.avatar = avatarMatch && avatarMatch[1].trim() !== '_No response_' ? avatarMatch[1].trim() : '';
              console.log(`🔍 解析头像链接: "${data.avatar || '(未提供)'}"`);
              
              const descMatch = body.match(/### 站点简介（可选）\n\n([^\n]+)/);
              data.description = descMatch && descMatch[1].trim() !== '_No response_' ? descMatch[1].trim() : '';
              console.log(`🔍 解析站点简介: "${data.description || '(未提供)'}"`);
              
              const backlinkMatch = body.match(/### 友链页 URL\n\n([^\n]+)/);
              data.backlink = backlinkMatch ? backlinkMatch[1].trim() : '';
              console.log(`🔍 解析友链页 URL: "${data.backlink}"`);
              
              const spaMatch = body.match(/### 是否为单页应用（SPA）\n\n([^\n]+)/);
              data.is_spa = spaMatch ? spaMatch[1].trim() === '是' : false;
              console.log(`🔍 解析 SPA 状态: "${spaMatch ? spaMatch[1].trim() : '未匹配'}" → is_spa = ${data.is_spa}`);
              
              return data;
            }
            
            const parsed = parseFriendIssue(body);
            
            console.log("\n📋 解析完成:");
            console.log(`   site_name: "${parsed.site_name}"`);
            console.log(`   site_url: "${parsed.site_url}"`);
            console.log(`   avatar: "${parsed.avatar || '(空)'}"`);
            console.log(`   description: "${parsed.description || '(空)'}"`);
            console.log(`   backlink: "${parsed.backlink}"`);
            console.log(`   is_spa: ${parsed.is_spa}`);
            
            core.setOutput('site_name', parsed.site_name);
            core.setOutput('site_url', parsed.site_url);
            core.setOutput('avatar', parsed.avatar);
            core.setOutput('description', parsed.description);
            core.setOutput('backlink', parsed.backlink);
            core.setOutput('is_spa', parsed.is_spa.toString());

      - name: 🔍 检查域名是否已存在
        id: check-duplicate
        if: steps.check-blacklist.outputs.blacklisted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const friendsPath = path.join(process.env.GITHUB_WORKSPACE, 'friends.json');
            const newUrl = '${{ steps.parse.outputs.site_url }}';
            
            function getHostname(url) {
              try {
                const u = new URL(url);
                return u.hostname.toLowerCase();
              } catch {
                return url.toLowerCase();
              }
            }
            
            const newHostname = getHostname(newUrl);
            console.log(`🔍 新申请 hostname: ${newHostname} (来自 ${newUrl})`);
            
            let duplicateFound = false;
            let matchedEntry = null;
            
            if (fs.existsSync(friendsPath)) {
              const content = fs.readFileSync(friendsPath, 'utf-8');
              const friends = JSON.parse(content);
              
              console.log(`📖 已有 ${friends.length} 条友链`);
              
              for (const entry of friends) {
                const existingHostname = getHostname(entry.url);
                
                console.log(`   ${entry.name}: ${entry.url} → hostname: ${existingHostname}`);
                
                if (existingHostname === newHostname) {
                  duplicateFound = true;
                  matchedEntry = entry;
                  console.log(`   ⚠️ 发现重复 hostname！已有条目: ${entry.name} (${entry.url})`);
                  break;
                }
              }
            } else {
              console.log("📄 friends.json 不存在，无需查重");
            }
            
            console.log(`\n📊 查重结果: ${duplicateFound ? '❌ 重复' : '✅ 无重复'}`);
            
            core.setOutput('duplicate', duplicateFound.toString());
            if (matchedEntry) {
              core.setOutput('matched_name', matchedEntry.name);
              core.setOutput('matched_url', matchedEntry.url);
            }

      - name: ❌ 域名重复 - 自动拒绝
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const matchedName = '${{ steps.check-duplicate.outputs.matched_name }}';
            const matchedUrl = '${{ steps.check-duplicate.outputs.matched_url }}';
            const newSiteName = '${{ steps.parse.outputs.site_name }}';
            const newSiteUrl = '${{ steps.parse.outputs.site_url }}';
            
            console.log(`❌ 域名重复，拒绝 Issue #${issueNumber}`);
            console.log(`   新申请: ${newSiteName} (${newSiteUrl})`);
            console.log(`   已有: ${matchedName} (${matchedUrl})`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['rejected']
            });
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'review'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ **自动拒绝**：域名 \`${newSiteUrl}\` 已被友链 \`${matchedName}\` (${matchedUrl}) 占用。\n\n同一域名不可重复申请，如需更新请修改原 Issue。`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
            
            console.log("🔒 Issue 已关闭并打上 rejected 标签");

      - name: 处理 SPA 站点
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.parse.outputs.is_spa == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            
            console.log(`🌐 检测到 SPA 站点，Issue #${issueNumber}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['manual']
            });
            console.log("✅ manual 标签添加成功");
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'review'
            });
            console.log("✅ review 标签移除成功");
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '🌐 检测到您的站点为单页应用（SPA），需要管理员手动审核处理，请耐心等待。'
            });
            console.log("✅ 评论已添加");

      - name: 处理非 SPA 站点 - 检查友链
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.parse.outputs.is_spa == 'false'
        id: check-backlink
        uses: actions/github-script@v7
        with:
          script: |
            const backlinkUrl = '${{ steps.parse.outputs.backlink }}';
            const mySiteDomain = process.env.MY_SITE_DOMAIN;
            
            console.log("==========================================");
            console.log("🔍 开始检查友链");
            console.log(`📎 友链页 URL: "${backlinkUrl}"`);
            console.log(`🔎 查找域名: "${mySiteDomain}"`);
            
            async function checkBacklink(url) {
              console.log(`🌐 请求 URL: ${url}`);
              
              try {
                const response = await fetch(url, {
                  redirect: 'manual',
                  headers: {
                    'User-Agent': 'Mozilla/5.0 (compatible; FriendLinkChecker/1.0)'
                  }
                });
                
                console.log(`📡 状态码: ${response.status}`);
                
                let html = '';
                let finalUrl = url;
                
                if (response.status >= 300 && response.status < 400) {
                  const location = response.headers.get('location');
                  console.log(`🔄 重定向到: ${location}`);
                  
                  if (location) {
                    finalUrl = location;
                    const realResponse = await fetch(finalUrl, {
                      headers: {
                        'User-Agent': 'Mozilla/5.0 (compatible; FriendLinkChecker/1.0)'
                      }
                    });
                    html = await realResponse.text();
                    console.log(`📏 页面大小: ${html.length} 字符`);
                  }
                } else {
                  html = await response.text();
                  console.log(`📏 页面大小: ${html.length} 字符`);
                }
                
                // 第一步：搜索裸域名
                console.log(`\n🔎 第一步：搜索 "${mySiteDomain}"`);
                const foundInHtml = html.toLowerCase().includes(mySiteDomain.toLowerCase());
                console.log(`   ${foundInHtml ? '✅ 找到!' : '❌ 未找到'}`);
                
                if (foundInHtml) {
                  return { status: 'passed', message: '找到友链' };
                }
                
                // 第二步：扫描参数值
                console.log(`\n🔎 第二步：扫描 URL 参数`);
                const allParamValues = extractAllParamValues(finalUrl);
                console.log(`   提取到 ${allParamValues.length} 个参数值`);
                
                for (const val of allParamValues) {
                  if (val.toLowerCase().includes(mySiteDomain.toLowerCase())) {
                    console.log(`   ✅ 参数中找到匹配!`);
                    return { status: 'passed', message: '找到友链（参数中）' };
                  }
                }
                
                console.log(`\n❌ 未找到友链`);
                return { status: 'failed', message: '未在友链页面找到本站链接' };
                
              } catch (error) {
                console.error(`\n❌ 访问失败: ${error.message}`);
                return { status: 'failed', message: `页面访问失败: ${error.message}` };
              }
            }
            
            function extractAllParamValues(url) {
              const values = [];
              
              try {
                const parsed = new URL(url);
                for (const [key, value] of parsed.searchParams) {
                  values.push(value);
                  
                  try {
                    const decoded = decodeURIComponent(value);
                    if (decoded !== value) values.push(decoded);
                  } catch {}
                  
                  try {
                    const base64Decoded = Buffer.from(value, 'base64').toString('utf-8');
                    if (base64Decoded && !base64Decoded.includes('�')) values.push(base64Decoded);
                  } catch {}
                }
              } catch (e) {
                console.log(`   URL 解析失败: ${e.message}`);
              }
              
              return values;
            }
            
            const result = await checkBacklink(backlinkUrl);
            
            console.log("\n==========================================");
            console.log(`📊 结果: ${result.status} - ${result.message}`);
            console.log("==========================================");
            
            core.setOutput('status', result.status);
            core.setOutput('message', result.message);

      - name: 友链检查失败 - 标记手动处理
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.check-backlink.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const message = '${{ steps.check-backlink.outputs.message }}';
            
            console.log(`❌ 检查失败: ${message}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['manual']
            });
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'review'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ 自动检查未通过：${message}\n\n请等待管理员手动处理。`
            });
            
            console.log("✅ 已标记 manual，等待人工处理");

      - name: 友链检查通过 - 添加到 friends.json
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.check-backlink.outputs.status == 'passed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const friendsPath = path.join(process.env.GITHUB_WORKSPACE, 'friends.json');
            
            console.log(`📂 friends.json 路径: ${friendsPath}`);
            
            let friends = [];
            if (fs.existsSync(friendsPath)) {
              const content = fs.readFileSync(friendsPath, 'utf-8');
              friends = JSON.parse(content);
              console.log(`📖 现有 ${friends.length} 条友链`);
            } else {
              console.log("📄 创建新文件");
            }
            
            const newEntry = {
              name: '${{ steps.parse.outputs.site_name }}',
              avatar: '${{ steps.parse.outputs.avatar }}',
              description: '${{ steps.parse.outputs.description }}',
              url: '${{ steps.parse.outputs.site_url }}',
              backlink: '${{ steps.parse.outputs.backlink }}'
            };
            
            console.log(`➕ 添加: ${newEntry.name} (${newEntry.url})`);
            
            friends.push(newEntry);
            fs.writeFileSync(friendsPath, JSON.stringify(friends, null, 2), 'utf-8');
            console.log(`💾 已保存，共 ${friends.length} 条友链`);

      - name: 提交并推送 friends.json
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.check-backlink.outputs.status == 'passed'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add friends.json
          git commit -m '添加友链: ${{ steps.parse.outputs.site_name }}'
          git push
          echo "✅ 已推送到远程"

      - name: 友链添加成功 - 打标、评论并关闭
        if: steps.check-blacklist.outputs.blacklisted == 'false' && steps.check-duplicate.outputs.duplicate == 'false' && steps.check-backlink.outputs.status == 'passed'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            
            console.log(`✅ 处理 Issue #${issueNumber}`);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['pass']
            });
            
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'review'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '✅ 友链已添加，请等待网站更新。'
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
            
            console.log("🔒 Issue 已关闭");
            console.log("🎉 处理完成")
